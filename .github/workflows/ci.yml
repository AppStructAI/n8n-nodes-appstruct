name: Package checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run check:scanner
      - run: npm run check:package
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-package-${{ github.sha }}
          path: n8n-nodes-appstruct-*.tgz
          if-no-files-found: error
          retention-days: 14
