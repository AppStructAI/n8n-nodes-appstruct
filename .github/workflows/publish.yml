name: Publish to npm

# Release remains a deliberate maintainer action. Pushing or merging does not publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify the requested package version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='n8n-nodes-appstruct'||p.version!==process.env.REQUESTED_VERSION) throw Error('Package or version mismatch');"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:credentials
      - name: Check current n8n source requirements before publishing
        env:
          SCANNER_DIR: ${{ runner.temp }}/appstruct-n8n-scanner
        run: |
          npm install --prefix "$SCANNER_DIR" --ignore-scripts --no-audit --no-fund @n8n/scan-community-package@0.43.0
          node --input-type=module <<'JS'
          import { pathToFileURL } from 'node:url';
          const scanner = await import(pathToFileURL(`${process.env.SCANNER_DIR}/node_modules/@n8n/scan-community-package/dist/scanner.js`));
          const result = await scanner.analyzePackage(process.cwd(), scanner.SOURCE_FILE_PATTERNS);
          if (!result.passed) {
            console.error(result.details || result.message);
            process.exit(1);
          }
          JS
      - name: Publish using npm trusted publishing
        # Requires a one-time npm Trusted Publisher configuration for this file.
        # npm 11.5.1+ supports OIDC; no persistent npm access token is configured.
        run: |
          npm install --global npm@11.6.2
          npm publish --provenance --access public
